server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the backend Cloud Run service
    # NOTE: In Cloud Run, you might prefer to handle API routing at a load balancer,
    # but this allows the frontend container to proxy if needed.
    # It is recommended to use an environment variable or build-time ARG to set this.
}
